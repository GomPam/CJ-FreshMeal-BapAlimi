name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 (예: 1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Sync wails.json productVersion
        shell: pwsh
        run: |
          $json = Get-Content wails.json -Raw | ConvertFrom-Json
          $json.info.productVersion = "${{ inputs.version }}"
          $json | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8

      - name: Commit version bump & create tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wails.json
          if ! git diff --cached --quiet; then
            git commit -m "[chore] bump productVersion to ${{ inputs.version }}"
            git push origin main
          fi
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}

      - name: Build
        run: wails build -clean -ldflags "-X main.appVersion=${{ inputs.version }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: build/bin/CJ-BapAlimi.exe
